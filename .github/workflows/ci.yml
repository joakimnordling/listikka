name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels a run still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: npm ci
      # The runner's own Google Chrome, which comes with its system libraries, instead of installing Playwright's
      # Chromium and its dependencies (about 4 minutes)
      - name: Chrome
        run: echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Lokki's sync server, at the commit of the copied sync package
        run: scripts/fetch-lokki-server.sh
      - name: Sync against the server
        run: npm run test:sync
      - name: End-to-end tests (built site)
        run: npm run test:e2e
